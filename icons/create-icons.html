<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Generate PassGen Icons</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0c0c14;
            color: #e2e2f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
        }

        p {
            color: #8888a8;
            font-size: 13px;
            text-align: center;
            max-width: 360px;
        }

        .canvases {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .canvas-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5a5a72;
        }

        button {
            padding: 10px 24px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <h1>PassGen — Icon Generator</h1>
    <p>Click the button below to generate and download the three PNG icons required by the extension. Place them in the
        <strong>icons/</strong> folder.</p>

    <div class="canvases">
        <div class="canvas-wrap"><canvas id="c16" width="16" height="16"></canvas>16×16</div>
        <div class="canvas-wrap"><canvas id="c48" width="48" height="48"></canvas>48×48</div>
        <div class="canvas-wrap"><canvas id="c128" width="128" height="128"></canvas>128×128</div>
    </div>

    <button onclick="downloadAll()">Download All Icons</button>

    <script>
        function drawIcon(canvas) {
            const s = canvas.width;
            const cx = canvas.getContext('2d');

            // Background gradient
            const grad = cx.createLinearGradient(0, 0, s, s);
            grad.addColorStop(0, '#3b1a78');
            grad.addColorStop(1, '#7c3aed');
            cx.fillStyle = grad;
            const r = s * 0.22;
            cx.beginPath();
            cx.moveTo(r, 0);
            cx.lineTo(s - r, 0);
            cx.quadraticCurveTo(s, 0, s, r);
            cx.lineTo(s, s - r);
            cx.quadraticCurveTo(s, s, s - r, s);
            cx.lineTo(r, s);
            cx.quadraticCurveTo(0, s, 0, s - r);
            cx.lineTo(0, r);
            cx.quadraticCurveTo(0, 0, r, 0);
            cx.closePath();
            cx.fill();

            // Lock body
            const scale = s / 128;
            cx.strokeStyle = 'rgba(255,255,255,0.95)';
            cx.lineCap = 'round';
            cx.lineJoin = 'round';

            // Shackle (arc)
            cx.lineWidth = 9 * scale;
            cx.beginPath();
            cx.arc(64 * scale, 54 * scale, 20 * scale, Math.PI, 0, false);
            cx.stroke();

            // Lock body rectangle
            const bx = 38 * scale, by = 66 * scale;
            const bw = 52 * scale, bh = 42 * scale, br = 6 * scale;
            cx.lineWidth = 0;
            cx.fillStyle = 'rgba(255,255,255,0.92)';
            cx.beginPath();
            cx.moveTo(bx + br, by);
            cx.lineTo(bx + bw - br, by);
            cx.quadraticCurveTo(bx + bw, by, bx + bw, by + br);
            cx.lineTo(bx + bw, by + bh - br);
            cx.quadraticCurveTo(bx + bw, by + bh, bx + bw - br, by + bh);
            cx.lineTo(bx + br, by + bh);
            cx.quadraticCurveTo(bx, by + bh, bx, by + bh - br);
            cx.lineTo(bx, by + br);
            cx.quadraticCurveTo(bx, by, bx + br, by);
            cx.closePath();
            cx.fill();

            // Keyhole
            cx.fillStyle = 'rgba(100,50,200,0.85)';
            cx.beginPath();
            cx.arc(64 * scale, 83 * scale, 7 * scale, 0, Math.PI * 2);
            cx.fill();
            cx.fillRect(60 * scale, 89 * scale, 8 * scale, 9 * scale);
        }

        const sizes = [16, 48, 128];
        sizes.forEach(s => {
            const c = document.getElementById(`c${s}`);
            drawIcon(c);
        });

        function downloadAll() {
            sizes.forEach(s => {
                const canvas = document.getElementById(`c${s}`);
                const link = document.createElement('a');
                link.download = `icon${s}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>

</html>
