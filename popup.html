<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassGen</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            </div>
            <span class="header-title">PassGen</span>
        </header>

        <!-- Password Display -->
        <div class="password-box">
            <span id="password-text" class="password-text placeholder">Click Generate</span>
            <button id="copy-btn" class="copy-btn" title="Copy to clipboard" disabled>
                <svg id="copy-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
                <svg id="check-icon" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </button>
        </div>

        <!-- Strength Indicator -->
        <div class="strength-row">
            <div class="strength-bar">
                <div id="strength-fill" class="strength-fill"></div>
            </div>
            <span id="strength-label" class="strength-label">—</span>
        </div>

        <!-- Options -->
        <div class="options">

            <!-- Length Slider -->
            <div class="option-group">
                <div class="option-header">
                    <label class="option-label" for="length-slider">Length</label>
                    <span id="length-display" class="length-value">16</span>
                </div>
                <input type="range" id="length-slider" class="slider" min="6" max="64" value="16" />
                <div class="slider-ticks">
                    <span>6</span>
                    <span>20</span>
                    <span>40</span>
                    <span>64</span>
                </div>
            </div>

            <!-- Character Type Toggles -->
            <div class="option-group">
                <label class="option-label">Include</label>
                <div class="toggles-grid">
                    <label class="toggle-item">
                        <input type="checkbox" id="opt-uppercase" checked />
                        <span class="toggle-switch"></span>
                        <span class="toggle-label">Uppercase <em>A–Z</em></span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="opt-lowercase" checked />
                        <span class="toggle-switch"></span>
                        <span class="toggle-label">Lowercase <em>a–z</em></span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="opt-numbers" checked />
                        <span class="toggle-switch"></span>
                        <span class="toggle-label">Numbers <em>0–9</em></span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="opt-symbols" checked />
                        <span class="toggle-switch"></span>
                        <span class="toggle-label">Symbols <em>!@#$</em></span>
                    </label>
                </div>
            </div>

            <!-- Avoid Ambiguous -->
            <label class="toggle-item toggle-item--inline">
                <input type="checkbox" id="opt-no-ambiguous" />
                <span class="toggle-switch toggle-switch--small"></span>
                <span class="toggle-label toggle-label--muted">Avoid ambiguous characters <em>0 O l I</em></span>
            </label>

        </div>

        <!-- Generate Button -->
        <button id="generate-btn" class="generate-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            Generate
        </button>

    </div>

    <script src="popup.js"></script>
</body>

</html>
